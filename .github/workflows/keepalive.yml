name: Keep Render backend awake

on:
  schedule:
    # Every 10 minutes - Render free tier spins down after ~15 min of no traffic
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 30 https://fomo-backend-3s7g.onrender.com/health || echo "Ping failed (server may have been cold - this is expected occasionally)"
